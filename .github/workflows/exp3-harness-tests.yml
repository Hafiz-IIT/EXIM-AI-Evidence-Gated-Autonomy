name: Experiment 3 Harness Tests

on:
  push:
    branches:
      - research/exp3-real-model-harness
  pull_request:
    branches:
      - main
      - research/dependency-aware-witness-ancestry-v5-stacked
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Experiment 3 harness regression tests
        run: python -m unittest discover -s tests -p 'test_exp3_harness.py' -v
