name: Experiment 3 Harness Tests

on:
  push:
    branches:
      - research/exp3-real-model-harness
  pull_request:
    branches:
      - main
      - research/dependency-aware-witness-ancestry-v5-stacked
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Experiment 3 v0.4 harness regression tests
        run: python -m unittest discover -s tests -p 'test_exp3_harness.py' -v
      - name: Verify recovered historical B1-B8 controller rules
        run: python -m unittest tests.test_controller_policy_recovery -v
      - name: Run recovered C0-C14 offline unit tests
        working-directory: experiments/exp3_c0_c14
        run: python -m unittest -v
      - name: Run deterministic C0-C14 B1-B8 controller tests
        working-directory: experiments/exp3_c0_c14
        run: python -m unittest test_controllers_v1 -v
      - name: Run Prompt Pack v2 renderer and schema tests
        working-directory: experiments/exp3_c0_c14
        run: python -m unittest test_prompt_pack_v2 -v
      - name: Run provider adapter contract tests (no network)
        working-directory: experiments/exp3_c0_c14
        run: python -m unittest test_provider_adapters -v
      - name: Run deterministic feature mapper tests
        working-directory: experiments/exp3_c0_c14
        run: python -m unittest test_feature_mapper -v
      - name: Run model-facing case blinding tests
        working-directory: experiments/exp3_c0_c14
        run: python -m unittest test_case_blinding -v
      - name: Validate source-backed reversibility assessment
        working-directory: experiments/exp3_c0_c14
        run: python -m unittest test_reversibility_assessment -v
      - name: Run plan-only runner safety tests
        working-directory: experiments/exp3_c0_c14
        run: python -m unittest test_runner -v
      - name: Run disposable DRY-01 to DRY-06 mechanical checks
        working-directory: experiments/exp3_c0_c14
        run: python dry_run_suite.py
      - name: Validate 28-call zero-cost routing manifest
        working-directory: experiments/exp3_c0_c14
        run: python validate_manifest.py
      - name: Validate all 28 Prompt Pack v2 rendered prompts offline
        working-directory: experiments/exp3_c0_c14
        run: python validate_v2_route_rendering.py
      - name: Validate Prompt Pack v2 28-call dry-run manifest
        working-directory: experiments/exp3_c0_c14
        run: python validate_manifest.py dry_run_manifest_v3_draft.json
      - name: Validate 630-call primary draft manifest
        working-directory: experiments/exp3_c0_c14
        run: python validate_primary_manifest.py
      - name: Validate E3 protocol v2 630-call primary manifest
        working-directory: experiments/exp3_c0_c14
        run: python validate_primary_manifest.py primary_run_manifest_v3_draft.json
