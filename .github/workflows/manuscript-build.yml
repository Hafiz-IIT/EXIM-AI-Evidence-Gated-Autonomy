name: Manuscript Build
on:
  push:
    paths: ["paper/**","scripts/**","src/**","tests/**","results/**","experiments/**","data/**",".github/workflows/manuscript-build.yml","README.md","docs/**"]
  pull_request:
    paths: ["paper/**","scripts/**","src/**","tests/**","results/**","experiments/**","data/**",".github/workflows/manuscript-build.yml"]
concurrency:
  group: manuscript-build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run policy and reconstruction regression tests
        id: tests
        run: python -m unittest discover -s tests -v
      - name: Generate benchmark
        id: generate
        run: python scripts/generate_benchmark.py
      - name: Verify benchmark integrity
        id: verify
        run: python scripts/verify_benchmark.py
      - name: Run new transparent reconstruction experiments
        id: runner
        run: |
          set +e
          python scripts/run_reconstruction_v1.py > /tmp/ega-runner.log 2>&1
          CODE=$?
          cat /tmp/ega-runner.log
          if [ "$CODE" -ne 0 ]; then
            echo "RUNNER_ERROR=$(tail -n 1 /tmp/ega-runner.log | cut -c1-100)" >> "$GITHUB_ENV"
            exit "$CODE"
          fi
      - name: Generate benchmark v0.4
        id: v04_generate
        run: python scripts/generate_benchmark_v04.py
      - name: Verify benchmark v0.4 integrity
        id: v04_verify
        run: python scripts/verify_benchmark_v04.py
      - name: Upload benchmark v0.4 source data
        if: always() && steps.v04_verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ega-benchmark-v04
          path: data/benchmark_v0.4/
          if-no-files-found: error
          retention-days: 90
      - name: Run v0.4 reconstruction and sensitivity analysis
        id: runner_v2
        run: |
          set +e
          python scripts/run_reconstruction_v2.py > /tmp/ega-v2-runner.log 2>&1
          CODE=$?
          cat /tmp/ega-v2-runner.log
          if [ "$CODE" -ne 0 ]; then
            echo "RUNNER_V2_ERROR=$(tail -n 1 /tmp/ega-v2-runner.log | cut -c1-100)" >> "$GITHUB_ENV"
            exit "$CODE"
          fi
      - name: Run document-root attestation threat experiments
        id: document_root
        run: python scripts/run_document_root_attestation.py
      - name: Upload document-root attestation outputs
        if: always() && steps.document_root.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ega-document-root-attestation-v1
          path: results/document_root_attestation/
          if-no-files-found: error
          retention-days: 90
      - name: Run four-authority evidence-trust v2 threat matrix
        id: evidence_trust_v2
        run: python scripts/run_evidence_trust_v2.py
      - name: Upload evidence-trust v2 outputs
        if: always() && steps.evidence_trust_v2.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ega-evidence-trust-v2
          path: results/evidence_trust_v2/
          if-no-files-found: error
          retention-days: 90
      - name: Run v3 authenticated independent-witness quorum experiment
        id: evidence_trust_v3
        run: python scripts/run_evidence_trust_v3.py
      - name: Upload evidence-trust v3 outputs
        if: always() && steps.evidence_trust_v3.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ega-evidence-trust-v3
          path: results/evidence_trust_v3/
          if-no-files-found: error
          retention-days: 90
      - name: Reproduce publication tables from checked-in historical result files
        id: tables
        run: python scripts/reproduce_tables.py
      - name: Upload reconstruction outputs
        if: always() && steps.runner.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ega-reconstruction-v1
          path: results/reconstruction_v1/
          if-no-files-found: error
          retention-days: 90
      - name: Upload v0.4 reconstruction and sensitivity outputs
        if: always() && steps.runner_v2.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ega-reconstruction-v2-benchmark-v04
          path: results/reconstruction_v2/
          if-no-files-found: error
          retention-days: 90
      - name: Compile manuscript
        id: latex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
      - name: Publish execution status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          RUNNER_OUTCOME: ${{ steps.runner.outcome }}
          TABLES_OUTCOME: ${{ steps.tables.outcome }}
          LATEX_OUTCOME: ${{ steps.latex.outcome }}
          RUNNER_ERROR: ${{ env.RUNNER_ERROR }}
          V04_GENERATE_OUTCOME: ${{ steps.v04_generate.outcome }}
          V04_VERIFY_OUTCOME: ${{ steps.v04_verify.outcome }}
          RUNNER_V2_OUTCOME: ${{ steps.runner_v2.outcome }}
          RUNNER_V2_ERROR: ${{ env.RUNNER_V2_ERROR }}
          DOCUMENT_ROOT_OUTCOME: ${{ steps.document_root.outcome }}
          EVIDENCE_TRUST_V2_OUTCOME: ${{ steps.evidence_trust_v2.outcome }}
          EVIDENCE_TRUST_V3_OUTCOME: ${{ steps.evidence_trust_v3.outcome }}
        run: |
          if [ "$TEST_OUTCOME" = "success" ] && [ "$GENERATE_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ] && [ "$RUNNER_OUTCOME" = "success" ] && [ "$V04_GENERATE_OUTCOME" = "success" ] && [ "$V04_VERIFY_OUTCOME" = "success" ] && [ "$RUNNER_V2_OUTCOME" = "success" ] && [ "$DOCUMENT_ROOT_OUTCOME" = "success" ] && [ "$EVIDENCE_TRUST_V2_OUTCOME" = "success" ] && [ "$EVIDENCE_TRUST_V3_OUTCOME" = "success" ] && [ "$TABLES_OUTCOME" = "success" ] && [ "$LATEX_OUTCOME" = "success" ]; then STATE=success; else STATE=failure; fi
          V1_STATUS="$RUNNER_OUTCOME"
          V2_STATUS="$RUNNER_V2_OUTCOME"
          case "$V1_STATUS" in success|failure|error) ;; *) V1_STATUS=failure ;; esac
          case "$V2_STATUS" in success|failure|error) ;; *) V2_STATUS=failure ;; esac
          curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"$STATE\",\"context\":\"portfolio/benchmark-integrity-and-manuscript-build\",\"description\":\"Tests, v0.3/v0.4 benchmark integrity, reconstruction, sensitivity, evidence-trust v2/v3, historical tables and LaTeX compilation\",\"target_url\":\"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
          curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"$V1_STATUS\",\"context\":\"portfolio/reconstruction-v1-diagnostic\",\"description\":\"${RUNNER_ERROR:-runner-passed}\",\"target_url\":\"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
          curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"$V2_STATUS\",\"context\":\"portfolio/reconstruction-v2-sensitivity\",\"description\":\"${RUNNER_V2_ERROR:-v04-runner-passed}\",\"target_url\":\"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
      - name: Fail workflow when verification fails
        if: steps.tests.outcome != 'success' || steps.generate.outcome != 'success' || steps.verify.outcome != 'success' || steps.runner.outcome != 'success' || steps.v04_generate.outcome != 'success' || steps.v04_verify.outcome != 'success' || steps.runner_v2.outcome != 'success' || steps.document_root.outcome != 'success' || steps.evidence_trust_v2.outcome != 'success' || steps.evidence_trust_v3.outcome != 'success' || steps.tables.outcome != 'success' || steps.latex.outcome != 'success'
        run: exit 1
