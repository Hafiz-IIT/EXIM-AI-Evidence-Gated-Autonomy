name: Manuscript Build

on:
  push:
    paths:
      - "paper/**"
      - "scripts/**"
      - "results/**"
      - ".github/workflows/manuscript-build.yml"
  pull_request:
    paths:
      - "paper/**"
      - "scripts/**"
      - "results/**"
      - ".github/workflows/manuscript-build.yml"

jobs:
  manuscript-and-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install reproducibility dependencies
        run: python -m pip install --upgrade pip pandas

      - name: Generate benchmark
        run: python scripts/generate_benchmark.py

      - name: Verify benchmark integrity
        run: python scripts/verify_benchmark.py

      - name: Reproduce publication tables
        run: python scripts/reproduce_tables.py

      - uses: xu-cheng/latex-action@v3
        with:
          root_file: paper/main.tex
          working_directory: .
          latexmk_use_xelatex: false
