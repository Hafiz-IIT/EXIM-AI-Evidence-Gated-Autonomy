name: Manuscript Build
on:
  push:
    paths: ["paper/**","scripts/**","results/**",".github/workflows/manuscript-build.yml"]
  pull_request:
    paths: ["paper/**","scripts/**","results/**",".github/workflows/manuscript-build.yml"]
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reproducibility dependencies
        run: python -m pip install --upgrade pip pandas
      - name: Generate benchmark
        id: generate
        run: python scripts/generate_benchmark.py
      - name: Verify benchmark integrity
        id: verify
        run: python scripts/verify_benchmark.py
      - name: Reproduce publication tables
        id: tables
        run: python scripts/reproduce_tables.py
      - name: Compile manuscript
        id: latex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
      - name: Publish execution status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          TABLES_OUTCOME: ${{ steps.tables.outcome }}
          LATEX_OUTCOME: ${{ steps.latex.outcome }}
        run: |
          if [ "$GENERATE_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ] && [ "$TABLES_OUTCOME" = "success" ] && [ "$LATEX_OUTCOME" = "success" ]; then STATE=success; else STATE=failure; fi
          curl -fsSL -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"$STATE\",\"context\":\"portfolio/manuscript-reproducibility\",\"description\":\"GitHub Actions executed benchmark generation, verification, table reproduction and LaTeX compilation for the current commit\",\"target_url\":\"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
      - name: Fail workflow when verification fails
        if: steps.generate.outcome != 'success' || steps.verify.outcome != 'success' || steps.tables.outcome != 'success' || steps.latex.outcome != 'success'
        run: exit 1
